name: Проверка ДЗ 4–5

on:
  push:
    paths:
      - "homework/hw04-05/submissions/**.ipynb"
      - "homework/hw04-05/grader/**"
      - ".github/workflows/grade-hw04-05.yml"
  pull_request:
    paths:
      - "homework/hw04-05/submissions/**.ipynb"
  workflow_dispatch:

# Ноутбуки студентов — чужой код: никаких секретов и прав на запись.
permissions:
  contents: read

concurrency:
  group: grade-hw04-05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: homework/hw04-05/grader/requirements.txt

      - name: Установить зависимости
        run: pip install -r homework/hw04-05/grader/requirements.txt

      - name: Проверить ноутбуки
        env:
          MPLBACKEND: Agg
        run: python homework/hw04-05/grader/grade.py homework/hw04-05/submissions --out grades

      - name: Таблица баллов в отчёт
        if: always()
        run: cat grades/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "Отчёт не создан" >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw04-05-grades
          path: grades/
          retention-days: 90
